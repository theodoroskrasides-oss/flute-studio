<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flute Studio · Prototype</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24304d;background:#f4f5ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#6654e8,#21b4bf);color:white;padding:24px 18px;border-radius:0 0 25px 25px}header h1{margin:3px 0;font-size:26px}header small{opacity:.9}.wrap{max-width:860px;margin:auto}main{padding:16px 14px 90px}.nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0}.nav button{white-space:nowrap}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #33337710}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#f0eeff;border-radius:13px;padding:15px}.metric strong{font-size:26px;display:block;color:#5843d6}button{border:0;border-radius:12px;padding:11px 15px;background:#e9e8fa;color:#413c77;font-weight:650;cursor:pointer}button.active,.primary{background:#6254dd;color:white}button.warn{background:#ffe8e8;color:#a32b44}input,select,textarea{font:inherit;width:100%;border:1px solid #dddff0;border-radius:10px;padding:11px;margin:6px 0 12px;background:white}textarea{min-height:95px}label{font-size:13px;font-weight:700;color:#5e6280}.muted{color:#72788d;font-size:13px}.pill{display:inline-block;background:#e8f9f7;color:#087d83;border-radius:30px;padding:5px 9px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.item{border-top:1px solid #edf0f8;padding:13px 0}.item:first-child{border:0}h2{font-size:20px;margin:8px 0 14px}h3{font-size:16px;margin:5px 0}p{line-height:1.5} .check{display:flex;gap:9px;align-items:center;padding:9px 0}.check input{width:auto;margin:0}.notice{background:#fff5dc;padding:12px;border-radius:12px;font-size:13px}.empty{padding:20px;color:#777;text-align:center}.hidden{display:none}@media(min-width:700px){header{border-radius:0 0 25px 25px}} </style></head><body><div class="wrap"><header><small>🎵 ΕΚΔΟΣΗ ΕΠΙΔΕΙΞΗΣ · ΧΩΡΙΣ ΠΡΑΓΜΑΤΙΚΟΥΣ ΛΟΓΑΡΙΑΣΜΟΥΣ</small><h1>Flute Studio</h1><div>Οργάνωση μαθημάτων & καθημερινή μελέτη</div></header><main><div class="notice">🔒 Πρωτότυπο μόνο για δοκιμές με φανταστικά δεδομένα. Η εναλλαγή ρόλων είναι προσομοίωση, όχι ασφαλής σύνδεση. Μην καταχωρίζετε πραγματικά στοιχεία μαθητών.</div><div class="card"><label>Προβολή εφαρμογής</label><select id="role" onchange="setRole()"><option value="teacher">Καθηγητής</option><option value="student">Μαθητής (δοκιμαστική προβολή)</option></select><div id="studentpick" class="hidden"><label>Δοκιμαστικός μαθητής</label><select id="who" onchange="render()"></select></div></div><div id="tabs" class="nav"></div><div id="view"></div></main></div>
<script>
const KEY='flute-studio-demo-v1';const seed={students:[{id:'s1',name:'Μαθητής Α',group:'school',approved:true},{id:'s2',name:'Μαθητής Β',group:'private',approved:true},{id:'s3',name:'Μαθητής Γ',group:'school',approved:false}],lessons:[{id:'l1',student:'s1',day:1,time:'15:00'},{id:'l2',student:'s2',day:2,time:'16:00'}],notes:[{id:'n1',student:'s1',date:'2026-10-20',private:'Χρειάζεται σταθερότερη άρθρωση.',public:'Κλίμακα Σολ μείζονα και μακροί φθόγγοι.'}],practice:[{id:'p1',student:'s1',date:'2026-10-20',minutes:35,categories:['Κλίμακες και αρπισμοί','Μουσικά έργα']}],changes:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){db=structuredClone(seed)}
let tab='home';const days=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];const groups={school:'Μουσικό Σχολείο Λεμεσού',private:'Flute Studio · Ιδιωτικά'};const cats=['Κλίμακες και αρπισμοί','Ασκήσεις τεχνικής','Μουσικά έργα'];
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function el(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return 'x'+Date.now()+Math.random().toString(36).slice(2,6)}function person(id){return db.students.find(s=>s.id===id)}function role(){return el('role').value}function student(){return el('who').value}function opts(items,selected){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}function setRole(){tab='home';render()}function nav(t){tab=t;render()}function fmt(time){let [h,m]=time.split(':').map(Number);m+=40;return String(h+Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function render(){const isTeacher=role()==='teacher';el('studentpick').classList.toggle('hidden',isTeacher);const pick=el('who');let current=pick.value;pick.innerHTML=opts(db.students.filter(s=>s.approved),current);if(!pick.value&&pick.options.length)pick.selectedIndex=0;
const ts=isTeacher?[['home','Αρχική'],['students','Μαθητές'],['schedule','Πρόγραμμα'],['notes','Σημειώσεις'],['progress','Πρόοδος'],['library','Βιβλιοθήκη']]:[['home','Αρχική'],['practice','Μελέτη'],['history','Οδηγίες'],['library','Αρχεία']];
if(!ts.some(x=>x[0]===tab))tab='home';el('tabs').innerHTML=ts.map(([id,name])=>`<button class="${tab===id?'active':''}" onclick="nav('${id}')">${name}</button>`).join('');
let content=isTeacher?teacherView():studentView();el('view').innerHTML=content}
function teacherView(){if(tab==='home'){let total=db.practice.reduce((a,p)=>a+p.minutes,0);return `<h2>Πίνακας καθηγητή</h2><div class="grid"><div class="metric"><strong>${db.students.length}</strong>Μαθητές</div><div class="metric"><strong>${db.lessons.length}</strong>Εβδομαδιαία μαθήματα</div><div class="metric"><strong>${total}′</strong>Καταγεγραμμένη μελέτη</div></div><div class="card"><h3>Οι δύο ομάδες σου</h3>${Object.entries(groups).map(([id,n])=>`<p>📍 ${n}: <b>${db.students.filter(s=>s.group===id).length}</b> μαθητές</p>`).join('')}</div>`}
if(tab==='students')return `<h2>Φάκελοι μαθητών</h2><div class="card"><h3>Νέος δοκιμαστικός μαθητής</h3><form onsubmit="addStudent(event)"><label>Όνομα (μόνο φανταστικό)</label><input id="sn" required maxlength="60" placeholder="π.χ. Μαθητής Δ"><label>Ομάδα</label><select id="sg"><option value="school">${groups.school}</option><option value="private">${groups.private}</option></select><label class="check"><input id="sa" type="checkbox"> Έχει καταγραφεί έγκριση (μόνο επίδειξη)</label><button class="primary">Προσθήκη</button></form></div>${Object.entries(groups).map(([g,name])=>`<div class="card"><h3>${name}</h3>${db.students.filter(s=>s.group===g).map(s=>`<div class="item row"><div><b>${esc(s.name)}</b><div class="muted">${s.approved?'✓ Δοκιμαστικά ενεργός':'⏳ Αναμονή έγκρισης'}</div></div><button onclick="toggleApproval('${s.id}')">${s.approved?'Απενεργοποίηση':'Έγκριση (demo)'}</button></div>`).join('')||'<div class="empty">Δεν υπάρχουν μαθητές</div>'}</div>`).join('')}`;
if(tab==='schedule')return `<h2>Σταθερό εβδομαδιαίο πρόγραμμα</h2><div class="card"><h3>Νέο μάθημα · 40 λεπτά</h3><form onsubmit="addLesson(event)"><label>Μαθητής</label><select id="ls">${opts(db.students)}</select><label>Ημέρα</label><select id="ld">${days.slice(1).map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}<option value="0">Κυριακή</option></select><label>Ώρα</label><input id="lt" type="time" value="15:00" required><button class="primary">Προσθήκη στο εβδομαδιαίο πρόγραμμα</button></form></div>${[1,2,3,4,5,6,0].map(d=>`<div class="card"><h3>${days[d]}</h3>${db.lessons.filter(l=>Number(l.day)===d).sort((a,b)=>a.time.localeCompare(b.time)).map(l=>`<div class="item"><div class="row"><div><b>${esc(l.time)}–${fmt(l.time)}</b> · ${esc(person(l.student)?.name||'Άγνωστος')}<div class="muted">${esc(groups[person(l.student)?.group]||'')}</div></div><button onclick="editLesson('${l.id}')">Αλλαγή</button></div>${db.changes.filter(c=>c.lesson===l.id).map(c=>`<div class="muted">↪ ${esc(c.date)}: ${c.cancel?'Ακύρωση':esc(c.time)}</div>`).join('')}</div>`).join('')||'<div class="muted">Χωρίς μάθημα</div>'}</div>`).join('')}`;
if(tab==='notes')return `<h2>Σημειώσεις μαθήματος</h2><div class="card"><form onsubmit="addNote(event)"><label>Μαθητής</label><select id="ns">${opts(db.students)}</select><label>Ημερομηνία</label><input id="nd" type="date" required value="${today()}"><label>Προσωπικές σημειώσεις · μόνο καθηγητής</label><textarea id="np" placeholder="Ιδιωτικές παρατηρήσεις..."></textarea><label>Οδηγίες προς μαθητή</label><textarea id="nu" placeholder="Ασκήσεις και στόχοι..."></textarea><label>Εισαγωγή περίληψης Read AI (χειροκίνητη επικόλληση)</label><textarea id="nai" placeholder="Επικόλλησε κείμενο και διάλεξε σε ποιο πεδίο θα μεταφερθεί..."></textarea><div class="row"><button type="button" onclick="pasteAI('np')">Στις ιδιωτικές</button><button type="button" onclick="pasteAI('nu')">Στις οδηγίες</button></div><p class="muted">Ελέγχεις και επεξεργάζεσαι το κείμενο πριν αποθηκευτεί. Δεν κοινοποιείται αυτόματα.</p><button class="primary">Αποθήκευση σημείωσης</button></form></div><div class="card"><h3>Ιστορικό καθηγητή</h3>${db.notes.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="item"><b>${esc(n.date)} · ${esc(person(n.student)?.name)}</b><p>🔒 ${esc(n.private)}</p><p>📖 ${esc(n.public)}</p></div>`).join('')}</div>`;
if(tab==='library')return libraryView(true);if(tab==='progress')return `<h2>Παρακολούθηση μελέτης</h2><div class="card"><label>Μαθητής</label><select onchange="showProgress(this.value)" id="progresspick">${opts(db.students,window.progressId)}</select><div id="progressdata"></div></div>`}
function showProgress(id){window.progressId=id;const data=db.practice.filter(p=>p.student===id).sort((a,b)=>b.date.localeCompare(a.date));el('progressdata').innerHTML=`<div class="metric"><strong>${data.reduce((a,p)=>a+p.minutes,0)}′</strong>Σύνολο καταγεγραμμένης μελέτης</div>${data.map(p=>`<div class="item"><b>${esc(p.date)} · ${p.minutes} λεπτά</b><div class="muted">${p.categories.map(esc).join(', ')}</div></div>`).join('')||'<p class="muted">Δεν υπάρχει καταγραφή.</p>'}`}
function studentView(){const s=person(student());if(!s)return '<div class="card">Δεν υπάρχει ενεργός δοκιμαστικός μαθητής.</div>';if(tab==='home')return `<h2>Γεια σου, ${esc(s.name)}!</h2><div class="card"><span class="pill">${esc(groups[s.group])}</span><h3>Το προσωπικό μου περιβάλλον</h3><p>Κατάγραψε τη σημερινή μελέτη σου ή διάβασε τις οδηγίες προηγούμενων μαθημάτων.</p><button class="primary" onclick="nav('practice')">Καταγραφή μελέτης</button></div>`;if(tab==='practice')return `<h2>Καθημερινή μελέτη</h2><div class="card"><form onsubmit="addPractice(event)"><label>Ημερομηνία</label><input type="date" id="pd" required value="${today()}"><label>Χρόνος μελέτης (λεπτά)</label><input type="number" id="pm" min="1" max="600" value="30" required><label>Κατηγορίες ασκήσεων</label>${cats.map((c,i)=>`<label class="check"><input type="checkbox" name="cat" value="${i}">${c}</label>`).join('')}<button class="primary">Καταχώριση</button></form></div><div class="card"><h3>Οι καταγραφές μου</h3>${db.practice.filter(p=>p.student===s.id).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class="item"><b>${esc(p.date)} · ${p.minutes}′</b><div class="muted">${p.categories.map(esc).join(' · ')}</div></div>`).join('')||'<p>Καμία καταχώριση.</p>'}</div>`;if(tab==='library')return libraryView(false);if(tab==='history')return `<h2>Όλες οι οδηγίες μου</h2>${db.notes.filter(n=>n.student===s.id&&n.public).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="card"><div class="muted">${esc(n.date)}</div><p>${esc(n.public)}</p></div>`).join('')||'<div class="card">Δεν υπάρχουν οδηγίες ακόμη.</div>'}`}
function libraryView(teacher){const selected=teacher?(window.libStudent||db.students[0]?.id):student();const items=(db.files||[]).filter(f=>f.student===selected);return `<h2>🎼 Ψηφιακή μουσική βιβλιοθήκη</h2><div class="card">${teacher?`<label>Φάκελος μαθητή</label><select onchange="window.libStudent=this.value;render()">${opts(db.students,selected)}</select>`:''}<p class="muted">PDF, παρτιτούρες, ήχος, βίντεο και άλλα αρχεία. Στην έκδοση επίδειξης τα αρχεία παραμένουν μόνο σε αυτή τη συσκευή και δεν συγχρονίζονται.</p><label>Επιλογή αρχείου</label><input id="fileInput" type="file" accept=".pdf,audio/*,video/*,image/*,.doc,.docx,.txt,.musicxml,.mxl"/><label>Τίτλος / περιγραφή</label><input id="fileTitle" placeholder="π.χ. Κοντσέρτο Mozart - μελέτη"/><button class="primary" onclick="addFile('${selected}')">Προσθήκη αρχείου (demo)</button></div><div class="card"><h3>Αρχεία μαθητή</h3>${items.length?items.map(f=>`<div class="item"><div class="row"><div><b>${f.type.startsWith('audio/')?'🎧':f.type==='application/pdf'?'🎼':'📁'} ${esc(f.title)}</b><div class="muted">${esc(f.name)} · ${Math.ceil(f.size/1024)} KB · ${esc(f.date)}</div></div><div class="row"><button onclick="openFile('${f.id}')">Άνοιγμα</button>${teacher||f.owner==='student'?`<button class="warn" onclick="deleteFile('${f.id}')">Διαγραφή</button>`:''}</div></div>${teacher&&f.owner==='student'?`<label>Γενικό σχόλιο καθηγητή</label><textarea id="comment-${f.id}" placeholder="Σχόλιο για την ηχογράφηση">${esc(f.comment||'')}</textarea><button onclick="saveComment('${f.id}')">Αποθήκευση σχολίου</button>`:f.comment?`<p>💬 <b>Σχόλιο καθηγητή:</b> ${esc(f.comment)}</p>`:''}</div>`).join(''):'<div class="empty">Δεν υπάρχουν αρχεία ακόμη.</div>'}</div><div class="notice">Οι σημειώσεις με Apple Pencil και η κοινοποίηση αλλαγών παρτιτούρας θα υλοποιηθούν σε επόμενο στάδιο. Η παρούσα οθόνη επιτρέπει προβολή PDF, όχι επεξεργασία.</div>`}
const localFiles={};function addFile(id){const file=el('fileInput').files[0];if(!file)return alert('Επίλεξε αρχείο.');if(file.size>15*1024*1024)return alert('Για την επίδειξη το μέγιστο μέγεθος είναι 15 MB.');const reader=new FileReader();reader.onload=()=>{const key=uid();try{localStorage.setItem('flute-file-'+key,reader.result)}catch(e){return alert('Δεν υπάρχει αρκετός χώρος στον browser. Δοκίμασε μικρότερο αρχείο.')}db.files=db.files||[];db.files.push({id:key,student:id,title:el('fileTitle').value.trim()||file.name,name:file.name,type:file.type||'application/octet-stream',size:file.size,date:today(),owner:role()});save()};reader.readAsDataURL(file)}
function openFile(id){const f=(db.files||[]).find(x=>x.id===id);const data=localStorage.getItem('flute-file-'+id);if(!data)return alert('Το αρχείο δεν υπάρχει πλέον σε αυτή τη συσκευή.');const a=document.createElement('a');a.href=data;a.target='_blank';a.rel='noopener';a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
function deleteFile(id){if(!confirm('Διαγραφή δοκιμαστικού αρχείου;'))return;localStorage.removeItem('flute-file-'+id);db.files=db.files.filter(x=>x.id!==id);save()}
function saveComment(id){const f=db.files.find(x=>x.id===id);f.comment=el('comment-'+id).value;save()}
function today(){return new Date().toLocaleDateString('en-CA')}
function addStudent(e){e.preventDefault();db.students.push({id:uid(),name:el('sn').value.trim(),group:el('sg').value,approved:el('sa').checked});save()}
function toggleApproval(id){let s=person(id);s.approved=!s.approved;save()}
function addLesson(e){e.preventDefault();db.lessons.push({id:uid(),student:el('ls').value,day:+el('ld').value,time:el('lt').value});save()}
function editLesson(id){let l=db.lessons.find(x=>x.id===id);let action=prompt('Γράψε: "μόνιμο", "προσωρινό" ή "ακύρωση"');if(!action)return;if(action==='μόνιμο'){let t=prompt('Νέα ώρα HH:MM',l.time);if(validTime(t)){l.time=t;save()}}else if(['προσωρινό','ακύρωση'].includes(action)){let date=prompt('Ημερομηνία αλλαγής YYYY-MM-DD',today());if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return alert('Μη έγκυρη ημερομηνία');let time=action==='προσωρινό'?prompt('Νέα ώρα HH:MM',l.time):null;if(action==='προσωρινό'&&!validTime(time))return;db.changes.push({lesson:id,date,time,cancel:action==='ακύρωση'});save()}}
function validTime(t){return /^([01]\d|2[0-3]):[0-5]\d$/.test(t||'')}
function pasteAI(dest){const txt=el('nai').value.trim();if(!txt)return;el(dest).value+=(el(dest).value?'\n':'')+txt;el('nai').value=''}
function addNote(e){e.preventDefault();db.notes.push({id:uid(),student:el('ns').value,date:el('nd').value,private:el('np').value,public:el('nu').value});save()}
function addPractice(e){e.preventDefault();const selected=[...document.querySelectorAll('input[name="cat"]:checked')].map(x=>cats[+x.value]);if(!selected.length)return alert('Επίλεξε τουλάχιστον μία κατηγορία.');db.practice.push({id:uid(),student:student(),date:el('pd').value,minutes:+el('pm').value,categories:selected});save()}
render();if(tab==='progress')showProgress(window.progressId||db.students[0]?.id);
const originalRender=render;render=function(){originalRender();if(role()==='teacher'&&tab==='progress')showProgress(window.progressId||db.students[0]?.id)}
</script></body></html>
